# Packed relative relocations (DT_RELR): pointers in static data are
# fixed up from a bitmap instead of one 24-byte relocation each, which
# makes the binary noticeably smaller. Needs glibc 2.36 at runtime, but GNU
# ld only packs when the glibc it links against supports it, so this never
# raises the requirement above what the build already has.
#
# x86_64 only, the one Linux target this was checked on.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-z,pack-relative-relocs"]
