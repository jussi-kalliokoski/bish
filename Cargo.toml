[package]
name = "bish"
version = "0.1.0"
edition = "2024"

[dependencies]

# `panic = "abort"` holds while nothing catches a panic. Once the
# coroutine scheduler runs, a panicking stage will end the shell instead of
# being reported.
[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1

# The browser build: `cargo build --profile web --target wasm32-wasip1`.
# Optimized for size, which makes shell logic about twice as slow, so
# native releases don't use it.
[profile.web]
inherits = "release"
opt-level = "z"

# Subsystems a build can leave out. The browser build drops all of them
# (`--no-default-features`), since none can work there. Each is switched at
# its entry points with `cfg!` instead of `#[cfg]`, so the code is still
# type-checked in both builds and the optimizer drops what's unreachable.
[features]
default = ["lsp", "dap", "mcp", "hexedit", "browser", "sessions"]
# Language-server clients in the editor, and `bish tool lsp-server`.
lsp = []
# Debug adapters and the built-in script debugger.
dap = []
# `bish tool mcp-server`.
mcp = []
# The hex editor.
hexedit = []
# The file browser.
browser = []
# `bish session ...` and the socket bish listens on for its panes.
sessions = []
